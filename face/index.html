<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live face</title>
<!--
  The assistant's face, drawn live with three.js behind a CRT tube effect.

  One full-screen quad; a fragment shader draws eyes and mouth from a few
  numbers, so any pose blends into any other. Props such as the microphones
  or the camera, and the speech bubble, status line, mic meter, timer clock
  and pictures, are painted on a 2D canvas that the shader lays over the
  face before the tube effect.

  Served by core/display_server.py it follows the engine through /events.
  Opened as a file it runs as a demo with buttons and keys:
    left/right arrows step through the faces, A answering, I idle,
    M microphone, C CRT on/off, H hide controls.
  Still frames: ?freeze=1&pose=happy&open=45&width=62&blink=0&fx=0&t=3
  Frame rate: 30 per second by default; ?fps=60 for the display's full rate.
-->
<style>
  :root { --frame: #080a09; --ink: #bdffcb; --dim: #5d7a63; --accent: #38b5a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--frame); overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font: 13px/1.4 'Courier New', ui-monospace, monospace; color: var(--ink);
         user-select: none; -webkit-user-select: none; touch-action: none; }
  #stage { position: relative; width: min(100vw, calc((100vh - 64px) * 800 / 480)); aspect-ratio: 800 / 480; }
  body.kiosk #stage { width: min(100vw, calc(100vh * 800 / 480)); }
  body.kiosk, body.kiosk canvas { cursor: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { height: 64px; display: flex; gap: 8px; align-items: center; padding: 0 12px; flex-wrap: wrap; justify-content: center; }
  body.kiosk #bar { display: none; }
  select { font: inherit; color: var(--ink); background: var(--frame); border: 2px solid var(--dim); border-radius: 6px; padding: 5px 8px; }
  button { font: inherit; color: var(--ink); background: transparent; border: 2px solid var(--dim);
           border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0d1410; font-weight: bold; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #fps, #note { color: var(--dim); }
  #fps { min-width: 7ch; text-align: right; }
</style>
</head>
<body>
<div id="stage"><canvas id="face" aria-label="The assistant's face"></canvas></div>
<div id="bar">
  <button id="btn-prev" title="Previous face">&larr;</button>
  <select id="pose" aria-label="Face"></select>
  <button id="btn-next" title="Next face">&rarr;</button>
  <button id="btn-mic" aria-pressed="false" title="Drive the mouth with your voice">Mic <u>M</u></button>
  <button id="btn-fx" aria-pressed="true" title="Curved glass, scanlines, phosphor glow, colour fringes, flicker">CRT <u>C</u></button>
  <button id="btn-live" aria-pressed="false" title="Follow the engine again" hidden>Live</button>
  <span id="note"></span>
  <span id="fps"></span>
</div>

<script type="module">
// three.js: the local copy when served by the engine, the CDN when opened as a file
const THREE = await import('./vendor/three.module.min.js')
  .catch(() => import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'));

// ── Shader: everything in 800×480 "face pixels", y pointing down ──────────
const fragmentShader = /* glsl */`
precision highp float;
varying vec2 vUv;

uniform float uPx;         // face pixels covered by one screen pixel (edge smoothing)
uniform float uTime;
uniform vec3  uBg;
uniform vec2  uGaze;       // eye offset
uniform float uBob;        // vertical offset of the whole face
uniform float uBlink;      // 0 open … 1 closed
uniform vec4  uEyeK;       // eye shape weights: U-arc, dot, happy arc, slanted line
uniform vec3  uEyeK2;      // more eye shapes: cross, heart, star
uniform float uEyeShow;    // 0 hides the eyes (a prop takes their place)
uniform float uWink;       // 1 = the right eye is a flat line
uniform float uDotR2;      // radius of the right dot eye
uniform float uHeartScale;
uniform float uStarRot;
uniform float uSlant;      // slanted-line eyes: +1 angry, −1 sad
uniform float uDotR;       // radius of the dot eye
uniform float uEyeScale;
uniform float uEyeY;       // eyes up/down (sad droop)
uniform float uEyeJit;     // eyes together/apart (angry tremble)
uniform vec3  uMouthK;     // mouth shape weights: line-or-pill, smile, frown
uniform float uMouthOpen;  // pill height, 0 (closed line) … 65
uniform float uMouthW;     // pill width
uniform float uMouthPlain; // 1 = no teeth or tongue (the surprised "o")
uniform float uMouthY;     // mouth up/down (happy bounce)
uniform float uMouthX;     // mouth left/right (boot animation)
uniform float uMouthShow;  // 0 hides the mouth (a prop draws it)
uniform sampler2D uOverlay; // bubble, status, meter, clock, pictures
uniform float uFx;         // 0 flat … 1 CRT tube

const vec3 LINE   = vec3(0.);
const vec3 CAVITY = vec3( 41., 131.,  57.) / 255.;
const vec3 TONGUE = vec3(112., 195., 112.) / 255.;
const vec3 TEETH  = vec3(1.);

const float STROKE = 8.0;
const vec2  EYE_L  = vec2(217., 195.);
const vec2  EYE_R  = vec2(581., 195.);
const vec2  MOUTH  = vec2(399., 302.);
const vec2  ARC_U  = vec2(0.9063078, -0.4226183);   // U-shaped eye: 130° gap at the top
const vec2  ARC_45 = vec2(0.7071068,  0.7071068);   // smile and frown: 90° of a circle
const vec2  ARC_90 = vec2(1.0, 0.0);                // happy eye: half a circle

float gSoft = 0.0;        // extra edge softness, used for the blurred copy behind the glow
float cover(float d) { return clamp(0.5 - d / (uPx + gSoft), 0.0, 1.0); }   // 1 inside, 0 outside

float sdSegment(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
}
// Arc centred on the +y axis (downwards here); sc = (sin, cos) of half its opening
float sdArc(vec2 p, vec2 sc, float ra) {
  p.x = abs(p.x);
  return (sc.y * p.x > sc.x * p.y) ? length(p - sc * ra) : abs(length(p) - ra);
}
float sdRoundBox(vec2 p, vec2 halfSize, float r) {
  vec2 q = abs(p) - halfSize + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float dot2(vec2 v) { return dot(v, v); }
// Heart with its tip at the origin and its top near y = 1 (after Inigo Quilez)
float sdHeart(vec2 p) {
  p.x = abs(p.x);
  if (p.y + p.x > 1.0) return sqrt(dot2(p - vec2(0.25, 0.75))) - sqrt(2.0) / 4.0;
  return sqrt(min(dot2(p - vec2(0.0, 1.0)), dot2(p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);
}

// side: −1 left eye, +1 right eye
float eye(vec2 p, vec2 centre, float side) {
  vec2 q = (p - centre - uGaze - vec2(side * uEyeJit, uEyeY)) / uEyeScale;
  float half_ = STROKE * 0.5;
  float right = step(0.0, side);
  // Only the round eyes blink: closing squashes them towards a flat lid.
  // A wink does the same to the right eye alone.
  float blink = max(uBlink * (uEyeK.x + uEyeK.y), uWink * right);
  float squash = 1.0 - 0.82 * blink;
  vec2 s = vec2(q.x, 5.0 + (q.y - 5.0) / squash);
  float arc   = (sdArc(s, ARC_U, 14.0) - half_) * squash;
  float dot_  = (length(s - vec2(0.0, 5.0)) - mix(uDotR, uDotR2, right)) * squash;
  float happy = sdArc(vec2(q.x, 13.0 - q.y), ARC_90, 14.0) - half_;
  float tilt  = side * uSlant * 10.0;
  float slant = sdSegment(q, vec2(-18.0, 5.0 + tilt), vec2(18.0, 5.0 - tilt)) - half_;
  vec2 v = q - vec2(0.0, 5.0);
  float crossed = min(sdSegment(v, vec2(-15.0, -15.0), vec2(15.0, 15.0)), sdSegment(v, vec2(-15.0, 15.0), vec2(15.0, -15.0))) - half_;
  float hs = 33.0 * uHeartScale;
  float heart = sdHeart(vec2(v.x, -v.y) / hs + vec2(0.0, 0.55)) * hs;
  float cs = cos(uStarRot), sn = sin(uStarRot);
  vec2 sv = abs(vec2(cs * v.x - sn * v.y, sn * v.x + cs * v.y));
  float star = (pow(sqrt(sv.x) + sqrt(sv.y), 2.0) - 22.0) * 0.5;      // four-point sparkle
  float shape = uEyeK.x * arc + uEyeK.y * dot_ + uEyeK.z * happy + uEyeK.w * slant
              + uEyeK2.x * crossed + uEyeK2.y * heart + uEyeK2.z * star;
  float lid   = sdSegment(q, vec2(-18.0, 5.0), vec2(18.0, 5.0)) - half_;
  // Hiding shrinks the eye away
  return mix(shape, lid, smoothstep(0.55, 1.0, blink)) * uEyeScale + (1.0 - uEyeShow) * 60.0;
}

// The face drawn live, at face-pixel position p
vec3 liveFace(vec2 p) {
  vec3 col = uBg;
  float dEyes = min(eye(p, EYE_L, -1.0), eye(p, EYE_R, 1.0));

  vec2 q = p - MOUTH - vec2(uMouthX, uMouthY);
  // Line that opens into a pill with teeth and tongue
  float halfW = uMouthW * 0.5;
  float h = max(uMouthOpen, STROKE);
  float caps = 4.0 * (1.0 - smoothstep(STROKE, 16.0, uMouthOpen));
  vec2 halfSize = vec2(halfW + caps, h * 0.5);
  float pill = sdRoundBox(q, halfSize, halfSize.y);
  float smile = sdArc(q + vec2(0.0, 20.0), ARC_45, 44.5) - STROKE * 0.5;
  float frown = sdArc(vec2(q.x, 20.0 - q.y), ARC_45, 44.5) - STROKE * 0.5;
  float dMouth = uMouthK.x * pill + uMouthK.y * smile + uMouthK.z * frown + (1.0 - uMouthShow) * 60.0;

  vec3 inside = CAVITY;
  float detail = 1.0 - uMouthPlain;
  float teethH = min(12.0, h / 3.0);
  float top = -halfSize.y + STROKE;
  float dTeeth = sdRoundBox(q - vec2(0.0, top + teethH * 0.5), vec2(halfSize.x - STROKE, teethH * 0.5), min(teethH * 0.5, 5.0));
  inside = mix(inside, TEETH, cover(dTeeth) * smoothstep(18.0, 26.0, h) * detail);
  float tongueH = min(20.0, h * 0.5);
  float tongueRx = max(halfW - 15.0, 1.0);
  float tongueRy = tongueH * 0.75;
  float bottom = halfSize.y - STROKE;
  float dTongue = (length(vec2(q.x / tongueRx, (q.y - (bottom - tongueH * 0.25)) / tongueRy)) - 1.0) * min(tongueRx, tongueRy);
  inside = mix(inside, TONGUE, cover(dTongue) * smoothstep(28.0, 36.0, h) * detail);

  col = mix(col, LINE, cover(dEyes));
  col = mix(col, LINE, cover(dMouth));
  col = mix(col, inside, cover(pill + STROKE) * uMouthK.x * uMouthShow);
  return col;
}

// Everything on the screen before the tube effect: face, then the overlay
vec3 picture(vec2 p) {
  vec2 st = vec2(p.x / 800.0, 1.0 - p.y / 480.0);
  vec3 col = liveFace(vec2(p.x, p.y - uBob));
  vec4 over = texture2D(uOverlay, st);
  return mix(col, over.rgb, over.a);
}

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

// ── CRT tube. Every effect is scaled by uFx, so 0 gives the flat picture ──
const vec3  BEZEL  = vec3(0.03, 0.04, 0.035);
const vec2  ASPECT = vec2(800.0 / 480.0, 1.0);

void main() {
  vec2 c = vUv * 2.0 - 1.0;                       // −1 … 1 across the glass

  // Curved glass: the picture bulges towards the viewer
  vec2 cc = c * (1.0 + uFx * vec2(0.05 * c.y * c.y, 0.085 * c.x * c.x)) * (1.0 + 0.04 * uFx);
  vec2 uv = cc * 0.5 + 0.5;
  vec2 p = vec2(uv.x * 800.0, (1.0 - uv.y) * 480.0);
  float line = p.y;

  // Now and then a few lines tear sideways for an instant
  float glitch = step(0.975, hash(vec2(floor(uTime * 9.0), 3.0)));
  p.x += uFx * glitch * 3.0 * sin(line * 0.35 + uTime * 40.0) * smoothstep(0.0, 1.0, hash(vec2(floor(line / 24.0), floor(uTime * 9.0))));

  vec3 col;
  if (uFx < 0.002) {
    col = picture(p);
  } else {
    // Colour fringes: red and blue land slightly apart, more so near the edges
    float fringe = uFx * (0.7 + 2.6 * dot(c, c));
    col.r = picture(p + vec2(fringe, 0.0)).r;
    col.g = picture(p).g;
    col.b = picture(p - vec2(fringe, 0.0)).b;

    // Phosphor glow: a blurred copy of the live face bleeds over the sharp one
    gSoft = 16.0;
    vec3 glow = picture(p);
    gSoft = 0.0;
    col = mix(col, glow, 0.30 * uFx) + 0.02 * uFx * glow;

    // Scanlines, thinner where the picture is bright
    float brightness = dot(col, vec3(0.3, 0.6, 0.1));
    float scan = 0.5 + 0.5 * cos(line * 3.14159265);
    col *= 1.0 - uFx * (0.34 - 0.16 * brightness) * (1.0 - scan);

    // Shadow mask: red, green and blue phosphor stripes
    float stripe = mod(gl_FragCoord.x, 3.0);
    vec3 mask = vec3(step(stripe, 1.0), step(1.0, stripe) * step(stripe, 2.0), step(2.0, stripe));
    col *= mix(vec3(1.0), 0.80 + 0.45 * mask, 0.55 * uFx);

    // A brighter band rolls slowly down the tube, plus mains flicker and grain
    float roll = fract(uv.y + uTime * 0.06);
    col *= 1.0 + uFx * 0.07 * smoothstep(0.0, 0.05, roll) * (1.0 - smoothstep(0.05, 0.22, roll));
    col *= 1.0 + uFx * 0.014 * sin(uTime * 97.0);
    col += uFx * 0.045 * (hash(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5);

    col *= 1.0 + 0.10 * uFx;                                        // make up for what the mask took
    col *= 1.0 - uFx * 0.42 * pow(dot(c, c) * 0.5, 1.4);            // darker towards the corners
    vec2 shine = c - vec2(-0.5, 0.55);
    col += uFx * 0.05 * exp(-dot(shine, shine) * 5.0);              // reflection on the glass
  }

  // Edge of the tube: rounded corners, a shadow just inside, the bezel outside
  float edge = sdRoundBox(cc * ASPECT, ASPECT, 0.16 * uFx + 0.0001);
  col *= 1.0 - uFx * 0.6 * smoothstep(-0.07, 0.0, edge);
  float px = 2.0 * uPx / 480.0;
  col = mix(BEZEL, col, clamp(0.5 - edge / px, 0.0, 1.0));

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const vertexShader = /* glsl */`
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

// ── Setup ────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const served = location.protocol.startsWith('http');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const $ = (id) => document.getElementById(id);

const theme = {
  face_bg: '#bdffcb', status_fg: '#1a5c2a', alert_fg: '#f44336',
  bubble_fill: '#ffffff', bubble_outline: '#2a6b3a', bubble_text: '#1a4a28',
};
let config = { screensaver: [] };

const canvas = $('face');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'low-power' });
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Overlay: a 2D canvas the size of the face, uploaded as a texture when it changes
const overlayCanvas = document.createElement('canvas');
overlayCanvas.width = 800; overlayCanvas.height = 480;
const ctx = overlayCanvas.getContext('2d');
const overlayTexture = new THREE.CanvasTexture(overlayCanvas);
overlayTexture.minFilter = overlayTexture.magFilter = THREE.LinearFilter;
overlayTexture.generateMipmaps = false;

// The face colours are written as plain sRGB numbers, so skip three's colour conversion
THREE.ColorManagement.enabled = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

const uniforms = {
  uPx: { value: 1 }, uTime: { value: 0 }, uBg: { value: new THREE.Color(theme.face_bg) },
  uGaze: { value: new THREE.Vector2() }, uBob: { value: 0 }, uBlink: { value: 0 },
  uEyeK: { value: new THREE.Vector4(1, 0, 0, 0) }, uEyeK2: { value: new THREE.Vector3(0, 0, 0) },
  uSlant: { value: 0 }, uDotR: { value: 17 }, uDotR2: { value: 17 }, uEyeShow: { value: 1 }, uWink: { value: 0 },
  uHeartScale: { value: 1 }, uStarRot: { value: 0 },
  uEyeScale: { value: 1 }, uEyeY: { value: 0 }, uEyeJit: { value: 0 },
  uMouthK: { value: new THREE.Vector3(1, 0, 0) }, uMouthOpen: { value: 0 }, uMouthW: { value: 97 },
  uMouthPlain: { value: 0 }, uMouthY: { value: 0 }, uMouthX: { value: 0 }, uMouthShow: { value: 1 },
  uOverlay: { value: overlayTexture },
  uFx: { value: 0 },
};
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader })));

function resize() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(ratio);
  renderer.setSize(w, h, false);
  uniforms.uPx.value = 800 / Math.max(w * ratio, 1);
}
new ResizeObserver(resize).observe(canvas);

// ── Poses ────────────────────────────────────────────────────────────────
// Every face is a pose: weights for the eye and mouth shapes the shader can
// draw, a few numbers, motion flags, and optionally a prop painted on the
// canvas (see PROPS).
//   eye:  [U-arc, dot, happy arc, slanted line]     eye2: [cross, heart, star]
//   mouth: [line/pill, smile, frown]
const E = { arc: [1, 0, 0, 0], dot: [0, 1, 0, 0], happy: [0, 0, 1, 0], line: [0, 0, 0, 1], none: [0, 0, 0, 0] };
const M = { line: [1, 0, 0], smile: [0, 1, 0], frown: [0, 0, 1] };
const POSES = {
  // What the engine is doing
  idle:        { eye: E.arc, mouth: M.line, gaze: 'wander' },
  listening:   { eye: E.arc, mouth: M.line, eyeShow: 0, mouthShow: 0, prop: 'listening' },
  thinking:    { eye: E.arc, mouth: M.line, prop: 'thinking' },
  speaking:    { eye: E.dot, mouth: M.line, talk: true },
  capturing:   { eye: E.arc, mouth: M.line, eyeShow: 0, mouthShow: 0, prop: 'capturing' },
  warmup:      { eye: E.arc, mouth: M.line, prop: 'warmup' },
  jamming:     { eye: E.line, mouth: M.smile, bounce: true, prop: 'jamming' },
  shhh:        { eye: E.arc, mouth: M.line, mouthShow: 0, blinkPulse: 0.4, prop: 'shhh' },
  error:       { eye: E.none, eye2: [1, 0, 0], mouth: M.frown },
  // Emotions
  happy:       { eye: E.happy, mouth: M.smile, bounce: true },
  sad:         { eye: E.line, mouth: M.frown, slant: -1, droop: true },
  angry:       { eye: E.line, mouth: M.line, slant: 1, tremble: true },
  surprised:   { eye: E.dot, mouth: M.line, dotR: 16, open: 40, width: 40, plain: 1, pulse: true },
  sleepy:      { eye: E.line, mouth: M.line, prop: 'sleepy' },
  dizzy:       { eye: E.none, eye2: [1, 0, 0], mouth: M.line, mouthShow: 0, prop: 'wavyMouth' },
  cheeky:      { eye: E.dot, mouth: M.line, dotR: 16, wink: 1, mouthShow: 0, prop: 'cheeky' },
  heart:       { eye: E.none, eye2: [0, 1, 0], mouth: M.smile, heartBeat: true },
  starry_eyed: { eye: E.none, eye2: [0, 0, 1], mouth: M.line, open: 40, width: 40, plain: 1, starSpin: true },
  confused:    { eye: E.dot, mouth: M.line, dotR: 23, wink: 1, mouthShow: 0, prop: 'wavyMouth' },
  // Screensaver moods
  daydream:    { eye: E.arc, mouth: M.line, blink: 0.18, eyeY: -3, drift: true, prop: 'daydream' },
  bored:       { eye: E.arc, mouth: M.frown, mouthY: -5, gaze: 'scan', scan: 8 },
  curious:     { eye: E.dot, mouth: M.line, dotR: 20, dotR2: 14, dotPulse: 3 },
  // Personas
  football:    { eye: E.happy, mouth: M.smile, prop: 'football' },
  detective:   { eye: E.arc, mouth: M.line, blink: 0.3, eyeY: 5, gaze: 'scan', scan: 10, prop: 'detective' },
  sir_mano:    { eye: E.dot, mouth: M.smile, dotR: 16, mouthY: 15, prop: 'sirMano' },
  low_battery: { eye: E.line, mouth: M.frown, slant: -1, eyeY: 2, prop: 'lowBattery' },
  bee:         { eye: E.dot, mouth: M.line, dotR: 18, open: 40, width: 40, plain: 1, gaze: 'bee', prop: 'bee' },
};
const POSE_KEYS = Object.keys(POSES);

// A value that eases towards its target (critically damped spring)
class Eased {
  constructor(value, speed) { this.value = value; this.target = value; this.velocity = 0; this.speed = speed; }
  step(dt) {
    // Small sub-steps: one big step overshoots and diverges once speed * dt nears 1 (30 fps, or a slow frame)
    const k = this.speed * this.speed, c = 2 * this.speed, n = Math.ceil(this.speed * dt / 0.3) || 1;
    for (let i = 0; i < n; i++) {
      this.velocity += (k * (this.target - this.value) - c * this.velocity) * dt / n;
      this.value += this.velocity * dt / n;
    }
    return this.value;
  }
  snap() { this.value = this.target; this.velocity = 0; }
}
const eased = (value, speed) => new Eased(value, speed);

const face = {
  eye: [eased(1, 22), eased(0, 22), eased(0, 22), eased(0, 22)],
  eye2: [eased(0, 22), eased(0, 22), eased(0, 22)],
  mouth: [eased(1, 22), eased(0, 22), eased(0, 22)],
  slant: eased(0, 20), dotR: eased(17, 25), dotR2: eased(17, 25), plain: eased(0, 25),
  wink: eased(0, 24), eyeShow: eased(1, 22), mouthShow: eased(1, 22), blinkMin: eased(0, 20),
  eyeY: eased(0, 18), mouthY: eased(0, 18), mouthX: eased(0, 12),
  mouthOpen: eased(0, 38), mouthW: eased(97, 30),
  gazeX: eased(0, 9), gazeY: eased(0, 9), eyeScale: eased(1, 30),
  fx: eased(1, 5),
};
const allEased = () => Object.values(face).flat();

// What to show. `engine` comes from the event stream; `override` from the demo controls.
const view = {
  engine: { phase: 'idle', expression: 'idle', muted: false, status: '' },
  override: null,
  pose: 'idle',
  poseSince: 0,           // clock time when this pose started (props animate from here)
};
function wanted() { return view.override || view.engine.expression || 'idle'; }

function applyExpression() {
  let name = wanted();
  if (name === 'screensaver') name = screensaver.current();
  if (!POSES[name]) name = 'idle';          // display_image and anything unknown
  if (name !== view.pose) { view.pose = name; view.poseSince = frozen ? 0 : clock; }
  const pose = POSES[name];
  pose.eye.forEach((w, i) => { face.eye[i].target = w; });
  (pose.eye2 || [0, 0, 0]).forEach((w, i) => { face.eye2[i].target = w; });
  pose.mouth.forEach((w, i) => { face.mouth[i].target = w; });
  face.slant.target = pose.slant || 0;
  face.dotR.target = pose.dotR || 17;
  face.dotR2.target = pose.dotR2 || pose.dotR || 17;
  face.plain.target = pose.plain || 0;
  face.wink.target = pose.wink || 0;
  face.eyeShow.target = pose.eyeShow === 0 ? 0 : 1;
  face.mouthShow.target = pose.mouthShow === 0 ? 0 : 1;
  face.blinkMin.target = pose.blink || 0;
  face.mouthX.target = 0;
  overlay.dirty = true;
  updateControls();
}

// Screensaver: wander through the faces the character pack lists for it
const screensaver = {
  name: 'idle', until: 0,
  current() { return this.name; },
  update(now) {
    if (wanted() !== 'screensaver' || now < this.until) return;
    const pool = (config.screensaver || []).filter((n) => POSES[n]);
    if (!pool.length) return;
    let next = pool[Math.floor(Math.random() * pool.length)];
    if (next === this.name && pool.length > 1) next = pool[(pool.indexOf(next) + 1) % pool.length];
    this.name = next;
    this.until = now + (next === 'bee' ? 6400 : rand(4500, 7500));
    applyExpression();
  },
};

// Boot: the engine reports loading stages (1 = brain loading … 15 = ready)
const boot = { stage: 0, since: 0 };
function bootProgress(now) {
  if (boot.stage >= 15) return 1;
  if (boot.stage === 14) return 0.97;
  if (boot.stage === 13) return 0.93;
  return Math.min((now - boot.since) / 12000, 1) * 0.88;
}

// ── Props: things a pose needs that are not eyes or a mouth ──────────────
// Painted on the overlay canvas each frame, in face pixels; t = seconds since the pose began.
const INK = '#000';
function stroke(width, colour = INK) { ctx.lineWidth = width; ctx.strokeStyle = colour; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function segment(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function disc(x, y, r, colour = INK) { ctx.fillStyle = colour; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry, colour) { ctx.fillStyle = colour; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function ring(x, y, r, from, to) { ctx.beginPath(); ctx.arc(x, y, r, from * Math.PI / 180, to * Math.PI / 180); ctx.stroke(); }
const wave = (t, speed) => 0.5 + 0.5 * Math.sin(t * speed);

function drawMic(cx, cy) {
  const top = cy - 18, bottom = cy + 18;
  ctx.fillStyle = '#3c3c3c'; stroke(6);
  roundRect(cx - 11, top, 22, 36, 11); ctx.fill(); ctx.stroke();
  stroke(2, '#646464');
  for (let y = top + 9; y < bottom - 6; y += 8) segment(cx - 5, y, cx + 5, y);
  stroke(8);
  segment(cx, bottom + 4, cx, bottom + 16);          // stand
  segment(cx - 18, bottom + 16, cx + 18, bottom + 16);   // base
  ring(cx, bottom - 4, 13, 0, 180);                  // cradle
}
function drawNote(x, y) {
  ellipse(x + 5, y + 4, 6, 4.5, INK);
  stroke(3); segment(x + 10, y + 2, x + 10, y - 20); segment(x + 10, y - 20, x + 17, y - 17);
}
function drawZ(x, y, size, width, alpha) {
  ctx.globalAlpha = alpha; stroke(width);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x + size, y + size); ctx.stroke();
  ctx.globalAlpha = 1;
}

const PROPS = {
  // A microphone in place of each eye, with sound waves rippling in from the sides
  listening(t) {
    drawMic(217, 200); drawMic(581, 200);
    stroke(8);
    [36, 26, 17].forEach((r, i) => {
      const phase = (t * 1.4 - i * 0.22) % 1;        // outer wave first, then inwards
      ctx.globalAlpha = clamp01(Math.sin(Math.max(phase, 0) * Math.PI) * 1.4);
      ring(217 - 75, 200, r - 4, -45, 45);
      ring(581 + 75, 200, r - 4, 135, 225);
    });
    ctx.globalAlpha = 1;
  },
  // A dot pacing back and forth between eyes and mouth
  thinking(t) { disc(410 + 20 * Math.sin(t * 2.2), 250, 10); },
  // A camera filling the screen; the aperture snaps shut and the flash fires
  capturing(t) {
    const cycle = (t % 1.2) / 1.2, shut = Math.pow(Math.sin(cycle * Math.PI), 6), flash = shut > 0.85;
    ctx.fillStyle = '#3c3c3c'; stroke(8); roundRect(120, 80, 560, 320, 30); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1e1e1e'; stroke(4); ctx.fillRect(160, 100, 60, 40); ctx.strokeRect(160, 100, 60, 40);
    disc(399, 70, 18, '#5a5a5a'); stroke(4); ring(399, 70, 18, 0, 360);
    ctx.fillStyle = flash ? '#fff' : '#ffe664'; ctx.fillRect(580, 100, 60, 40);
    stroke(flash ? 3 : 4, flash ? '#ffffc8' : INK); ctx.strokeRect(flash ? 570 : 580, flash ? 90 : 100, flash ? 80 : 60, flash ? 60 : 40);
    disc(399, 250, 100, '#141414'); stroke(8, '#646464'); ring(399, 250, 96, 0, 360);
    disc(399, 250, 80, '#0a0a28'); stroke(4, '#3c3c3c'); ring(399, 250, 78, 0, 360);
    const aperture = 60 - 57 * shut;
    disc(399, 250, aperture, '#282850'); stroke(3, '#505078'); ring(399, 250, aperture, 0, 360);
    ctx.globalAlpha = 0.7; disc(369, 220, 15, '#fff'); ctx.globalAlpha = 1;
  },
  // Boot: a progress bar, and scrambled symbols for eyes while the brain loads
  warmup(t, now) {
    const pct = bootProgress(now);
    ctx.fillStyle = '#dcffe6'; stroke(6); roundRect(269, 120, 260, 20, 10); ctx.fill(); ctx.stroke();
    if (pct > 0.02) { ctx.fillStyle = '#298339'; roundRect(269, 120, Math.max(260 * pct, 20), 20, 10); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = INK; ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${Math.round(pct * 100)}%`, 399, 100);
    if (boot.stage < 13) {
      const symbols = '$%@*+#?!&~^>', i = Math.floor((now - boot.since) / 1000);
      ctx.font = `bold 46px ${FONT}`;
      ctx.fillText(symbols[i % 12], 217, 202); ctx.fillText(symbols[(i + 3) % 12], 581, 202);
    }
  },
  // Notes bobbing next to the head
  jamming(t) {
    drawNote(625 + 8 * Math.sin(t * 2), 150 + 5 * Math.sin(t * 4));
    drawNote(648 - 6 * Math.sin(t * 2.6), 126 - 5 * Math.sin(t * 4));
  },
  // A small X for a mouth
  shhh(t) { const s = 10 + 6 * wave(t, 1.6); stroke(8); segment(399 - s, 302 - s, 399 + s, 302 + s); segment(399 - s, 302 + s, 399 + s, 302 - s); },
  // Zs drifting up and fading
  sleepy(t) {
    const a = (t % 4) / 4, b = ((t + 2) % 4) / 4;
    drawZ(600, 122 - a * 34, 25, 4, Math.sin(a * Math.PI));
    drawZ(650, 82 - b * 30, 15, 3, Math.sin(b * Math.PI));
  },
  // A squiggle that keeps flipping, for dizzy and confused
  wavyMouth(t) {
    const swing = Math.cos(t * 5);
    stroke(8); ctx.beginPath();
    for (let x = 364; x <= 436; x += 3) {
      const y = 300 + 14 * swing * Math.sin((x - 364) / 72 * Math.PI * 2);
      if (x === 364) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  },
  // A tongue wagging under a straight mouth
  cheeky(t) {
    const x = 409 + 10 * Math.sin(t * 3);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 302, 800, 60); ctx.clip();
    disc(x, 317, 15); disc(x, 317, 8, '#70c370');
    ctx.restore();
    stroke(8); segment(350.5, 302, 447.5, 302);
  },
  // Thought bubbles rising beside the head
  daydream(t) {
    const p = (t % 5) / 5, y = 180 - p * 80;
    ctx.globalAlpha = clamp01(Math.sin(p * Math.PI) * 1.6);
    if (p > 0.15) disc(625, y + 25, 5);
    if (p > 0.35) disc(642.5, y + 7.5, 7.5);
    if (p > 0.55) disc(653.5, y - 15, 11);
    ctx.globalAlpha = 1;
  },
  // Pink cheeks and a bow
  football() {
    const pink = '#ff69b4';
    ellipse(170, 245, 20, 15, pink); ellipse(630, 245, 20, 15, pink);
    ctx.fillStyle = pink;
    for (const dx of [-29, 29]) { ctx.beginPath(); ctx.moveTo(399, 70); ctx.lineTo(399 + dx, 50); ctx.lineTo(399 + dx, 90); ctx.closePath(); ctx.fill(); }
    ellipse(399, 70, 14, 10, pink);
  },
  // A fedora and a pipe
  detective(t) {
    ctx.fillStyle = '#323232'; ctx.fillRect(250, 100, 300, 20); ctx.fillRect(300, 20, 200, 80);
    ctx.fillStyle = '#141414'; ctx.fillRect(300, 85, 200, 15);
    stroke(8, '#8b4513'); ctx.lineCap = 'butt'; segment(399, 302, 450, 350);
    ctx.fillStyle = '#8b4513'; ctx.fillRect(440, 330, 20, 20);
    const puff = (t % 3) / 3;                       // a wisp of smoke from the pipe
    ctx.globalAlpha = 0.35 * Math.sin(puff * Math.PI); disc(452 + 6 * Math.sin(t * 2), 322 - puff * 46, 5 + puff * 7, '#555'); ctx.globalAlpha = 1;
  },
  // A handlebar moustache
  sirMano() {
    stroke(8); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.ellipse(364.5, 275, 30.5, 11, 0, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(433.5, 275, 30.5, 11, 0, 0, Math.PI); ctx.stroke();
    ring(325, 265, 11, 90, 270); ring(473, 265, 11, -90, 90);
  },
  // An almost empty battery, its last bar flashing
  lowBattery(t) {
    stroke(6); ctx.lineJoin = 'miter'; ctx.strokeRect(323, 53, 124, 44);
    ctx.fillStyle = INK; ctx.fillRect(450, 65, 15, 20);
    ctx.fillStyle = `rgb(${Math.round(100 + 155 * wave(t, 6))},0,0)`; ctx.fillRect(328, 58, 23, 34);
  },
  // A bee flying across; the eyes follow it (see beeX)
  bee(t) {
    const x = beeX(t), y = 150 + 30 * Math.sin(t * 2.6);
    ellipse(x + 25, y - 5 + 4 * Math.sin(t * 40), 10, 10, '#c8c8ff');      // wing
    ellipse(x + 20, y + 12.5, 20, 12.5, '#ffeb3b');
    ctx.save(); ctx.beginPath(); ctx.ellipse(x + 20, y + 12.5, 20, 12.5, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = INK; ctx.fillRect(x + 10, y, 6, 25); ctx.fillRect(x + 24, y, 6, 25);
    ctx.restore();
  },
};
function beeX(t) { return 100 + ((t % 6.4) / 6.4) * 640; }

// ── Motion ───────────────────────────────────────────────────────────────
const blink = { start: -1, next: rand(1.5, 3.5), double: false };
function blinkAmount(t) {
  if (t >= blink.next && blink.start < 0) { blink.start = t; blink.double = Math.random() < 0.18; }
  if (blink.start < 0) return 0;
  const e = t - blink.start, close = 0.07, hold = 0.04, open = 0.11;
  let v = 0;
  if (e < close) v = e / close;
  else if (e < close + hold) v = 1;
  else if (e < close + hold + open) v = 1 - (e - close - hold) / open;
  else { blink.start = -1; blink.next = t + (blink.double ? 0.12 : rand(2.4, 6.0)); blink.double = false; }
  return v * v * (3 - 2 * v);
}

const gaze = { next: rand(2, 5) };
function updateGaze(t) {
  const pose = POSES[view.pose], since = t - view.poseSince;
  if (pose.gaze === 'scan') { face.gazeX.target = pose.scan * Math.sin(since * 1.1); face.gazeY.target = 0; return; }
  if (pose.gaze === 'bee') { face.gazeX.target = (beeX(since) - 400) / 15; face.gazeY.target = 4 * Math.sin(since * 2.6); return; }
  if (pose.gaze !== 'wander') { face.gazeX.target = 0; face.gazeY.target = 0; return; }
  if (t < gaze.next) return;
  if (Math.abs(face.gazeX.target) > 0.5 || Math.random() < 0.45) { face.gazeX.target = 0; face.gazeY.target = 0; }
  else { face.gazeX.target = rand(-9, 9); face.gazeY.target = rand(-3, 3); }
  gaze.next = t + rand(1.2, 4.5);
}

// Speech loudness, from (in this order) the engine's envelope of what it is
// playing, the microphone in the demo, or an invented rhythm.
const speech = { level: 0, shape: 0.5, until: 0, target: 0, syllablesLeft: 0, envelope: null, stepMs: 20, startedAt: 0 };
const OUTPUT_DELAY_MS = 110;      // the sound reaches the speaker a little after it is sent
function envelopeLoudness(now) {
  const i = Math.floor((now - speech.startedAt - OUTPUT_DELAY_MS) / speech.stepMs);
  if (i < 0) return 0;
  if (i >= speech.envelope.length) { speech.envelope = null; return 0; }
  // Speech sits well below its loudest moment most of the time; lift the quiet part
  return Math.pow(speech.envelope[i], 0.6);
}
function syntheticLoudness(t) {
  if (t >= speech.until) {
    if (speech.syllablesLeft <= 0) { speech.target = 0; speech.until = t + rand(0.35, 0.8); speech.syllablesLeft = Math.floor(rand(5, 14)); }
    else if (speech.target > 0.05 && Math.random() < 0.3) { speech.target = 0; speech.until = t + rand(0.05, 0.12); }
    else { speech.target = rand(0.35, 1.0); speech.shape = Math.random(); speech.until = t + rand(0.09, 0.2); speech.syllablesLeft--; }
  }
  return speech.target;
}
const mic = { on: false, analyser: null, data: null, peak: 0.08 };
async function toggleMic() {
  if (mic.on) { mic.on = false; updateControls(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audio = new AudioContext();
    mic.analyser = audio.createAnalyser(); mic.analyser.fftSize = 1024;
    mic.data = new Float32Array(mic.analyser.fftSize);
    audio.createMediaStreamSource(stream).connect(mic.analyser);
    mic.on = true; setOverride('speaking'); note('Talk: the mouth follows your voice.');
  } catch (err) { note('Microphone unavailable: ' + err.message); }
  updateControls();
}
function micLoudness(dt) {
  mic.analyser.getFloatTimeDomainData(mic.data);
  let sum = 0;
  for (const v of mic.data) sum += v * v;
  const rms = Math.sqrt(sum / mic.data.length);
  mic.peak = Math.max(mic.peak * (1 - 0.15 * dt), rms, 0.03);
  return clamp01((rms - 0.01) / (mic.peak - 0.01));
}
function loudness(t, dt, now) {
  let target;
  if (speech.envelope) target = envelopeLoudness(now);
  else if (mic.on) target = micLoudness(dt);
  else if (served && !view.override) target = 0;      // following the engine: no sound, no movement
  else target = syntheticLoudness(t);
  const rate = target > speech.level ? 36 : 16;      // fast attack, slower release
  speech.level += (target - speech.level) * Math.min(1, rate * dt);
  if (Math.random() < dt * 6) speech.shape = Math.random();
  return speech.level;
}

// ── Overlay: bubble, status line, mic meter, timer clock, pictures ───────
const overlay = {
  dirty: true, lastDraw: 0,
  bubble: { text: '', until: 0, shownAt: 0 },
  meter: { raw: 0, smooth: 0, peak: 0, peakAt: 0 },
  timers: [],             // { endsAt, total }
  image: null,            // HTMLImageElement
};
const FONT = '"Courier New", ui-monospace, monospace';

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(text, maxWidth) {
  const lines = []; let lineText = '';
  for (const word of text.split(/\s+/)) {
    const attempt = lineText ? lineText + ' ' + word : word;
    if (ctx.measureText(attempt).width > maxWidth && lineText) { lines.push(lineText); lineText = word; }
    else lineText = attempt;
  }
  if (lineText) lines.push(lineText);
  return lines.slice(0, 4);
}
function lerpColour(a, b, t) {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',')})`;
}
function formatClock(seconds) {
  const total = Math.max(Math.ceil(seconds), 0);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const two = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${two(m)}:${two(s)}` : `${m}:${two(s)}`;
}

function drawOverlay(now) {
  const { phase, status, muted } = view.engine;
  ctx.clearRect(0, 0, 800, 480);

  if (overlay.image) ctx.drawImage(overlay.image, 0, 0, 800, 480);   // a photo or picture fills the screen
  const prop = PROPS[POSES[view.pose].prop];
  if (prop && !overlay.image) { ctx.save(); prop(clock - view.poseSince, now); ctx.restore(); }
  const quiet = phase === 'screensaver';                            // the screensaver shows the face only

  // Mic meter while listening: 22 segments, green to red, with a peak line
  if (phase === 'listening' && !overlay.image) {
    const m = overlay.meter, X = 348, Y = 73, SEG_W = 97, SEG_H = 12, GAP = 3, N = 22, PAD = 3;
    const target = clamp01(m.raw);
    m.smooth += (target > m.smooth ? 0.38 : 0.08) * (target - m.smooth);
    if (m.smooth > m.peak) { m.peak = m.smooth; m.peakAt = now; }
    else if (now - m.peakAt > 1200) m.peak *= 0.93;
    ctx.fillStyle = '#000';
    ctx.fillRect(X, Y, SEG_W + PAD * 2, N * (SEG_H + GAP) - GAP + PAD * 2);
    const lit = Math.round(m.smooth * N);
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      ctx.fillStyle = t < 0.55 ? lerpColour('#22cc55', '#ddcc22', t / 0.55) : lerpColour('#ddcc22', '#ee3333', (t - 0.55) / 0.45);
      ctx.globalAlpha = i < lit ? 1 : 0.12;
      ctx.fillRect(X + PAD, Y + PAD + (N - 1 - i) * (SEG_H + GAP), SEG_W, SEG_H);
    }
    ctx.globalAlpha = 1;
    if (m.peak > 0.02) {
      const seg = Math.min(Math.floor(m.peak * N), N - 1);
      ctx.fillStyle = '#fff';
      ctx.fillRect(X + PAD - 1, Y + PAD + (N - 1 - seg) * (SEG_H + GAP) + SEG_H / 2, SEG_W + 2, 1);
    }
  }

  // Speech bubble: what the user was heard to say
  const b = overlay.bubble;
  if (b.text && now < b.until && !quiet && !overlay.image) {
    ctx.font = `bold 16px ${FONT}`;
    const lines = wrapText(b.text, 560);
    const textW = Math.max(...lines.map((l) => ctx.measureText(l).width));
    const w = textW + 36, h = lines.length * 19 + 24, x = 400 - w / 2;
    const slide = Math.min((now - b.shownAt) / 220, 1);
    const y = 10 - (1 - slide * (2 - slide)) * (h + 40);
    ctx.fillStyle = theme.bubble_fill; ctx.strokeStyle = theme.bubble_outline; ctx.lineWidth = 2;
    roundRect(x, y, w, h, 16); ctx.fill(); ctx.stroke();
    for (const [r, dx, dy] of [[6, -20, 10], [4, -34, 22], [3, -42, 30]]) {
      ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(400 + dx, y + h + dy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = theme.bubble_text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((l, i) => ctx.fillText(l, 400, y + 21.5 + i * 19));
  }

  // Status line
  if (status && !quiet && !overlay.image) {
    ctx.font = `bold 19px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = theme.status_fg; ctx.fillText(status, 400, 433);
  }

  // Timer clock: a ring that empties, the remaining time in the middle
  const timers = overlay.timers;
  if (timers.length && !overlay.image && phase !== 'capturing' && phase !== 'warmup') {
    const first = timers[0], remaining = Math.max((first.endsAt - now) / 1000, 0);
    const cx = 74, cy = 74, R = 50, urgent = remaining <= 10;
    ctx.fillStyle = theme.bubble_fill; ctx.strokeStyle = theme.bubble_outline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R - 8, 0, Math.PI * 2); ctx.stroke();
    const blinkOff = urgent && Math.floor(remaining * 2) % 2 === 0;
    ctx.strokeStyle = blinkOff ? theme.bubble_outline : (urgent ? theme.alert_fg : theme.status_fg);
    ctx.lineWidth = 9; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(cx, cy, R - 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp01(remaining / Math.max(first.total, 0.001))); ctx.stroke();
    const label = formatClock(remaining);
    ctx.fillStyle = urgent ? theme.alert_fg : theme.status_fg;
    ctx.font = `bold ${label.length <= 5 ? 26 : 18}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 1);
    if (timers.length > 1) { ctx.font = `bold 13px ${FONT}`; ctx.fillStyle = theme.bubble_outline; ctx.fillText(`+${timers.length - 1}`, cx, cy + 24); }
  }

  if (muted) {
    ctx.font = `bold 20px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = theme.alert_fg; ctx.fillText('MUTED', 760, 30);
  }
  overlayTexture.needsUpdate = true;
}

function updateOverlay(now) {
  const b = overlay.bubble;
  if (b.text && now >= b.until) { b.text = ''; overlay.dirty = true; }
  const before = overlay.timers.length;
  overlay.timers = overlay.timers.filter((t) => t.endsAt > now - 300);
  if (overlay.timers.length !== before) overlay.dirty = true;
  const animating = POSES[view.pose].prop || view.engine.phase === 'listening' || overlay.timers.length > 0 || (b.text && now - b.shownAt < 300);
  if (!overlay.dirty && !(animating && now - overlay.lastDraw > 33)) return;
  overlay.dirty = false; overlay.lastDraw = now;
  drawOverlay(now);
}

// ── Engine connection ────────────────────────────────────────────────────
function connect() {
  const source = new EventSource('/events');
  const on = (name, handler) => source.addEventListener(name, (e) => handler(JSON.parse(e.data)));
  on('state', (state) => {
    const changed = state.expression !== view.engine.expression || state.phase !== view.engine.phase;
    view.engine = state; overlay.dirty = true;
    if (state.phase !== 'speaking') speech.envelope = null;
    if (changed) applyExpression();
  });
  on('bubble', ({ text, hold_ms }) => {
    overlay.bubble = { text: text || '', until: performance.now() + (hold_ms || 8000), shownAt: performance.now() };
    overlay.dirty = true;
  });
  on('meter', ({ level }) => { overlay.meter.raw = level; });
  on('boot', ({ stage }) => { if (stage === 1 || !boot.since) boot.since = performance.now(); boot.stage = stage; });
  on('speak', ({ envelope, step_ms }) => { speech.envelope = envelope; speech.stepMs = step_ms; speech.startedAt = performance.now(); });
  on('timers', ({ timers }) => {
    const now = performance.now();
    overlay.timers = timers.map((t, i) => {
      const endsAt = now + t.ends_in_s * 1000, known = overlay.timers[i];
      // Keep our own smoother clock unless the engine disagrees by more than a second
      return { endsAt: known && Math.abs(known.endsAt - endsAt) < 1200 ? known.endsAt : endsAt, total: t.total_s };
    });
    overlay.dirty = true;
  });
  on('image', ({ url }) => {
    if (!url) { overlay.image = null; overlay.dirty = true; return; }
    const image = new Image();
    image.onload = () => { overlay.image = image; overlay.dirty = true; };
    image.src = url;
  });
  source.onopen = () => note('');
  source.onerror = () => note('Waiting for the engine…');
}

// Touch, as on the old display: tap = mute, 5 s = shut down
function sendAction(type) {
  fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type }) }).catch(() => {});
}
let pressedAt = 0;
canvas.addEventListener('pointerdown', () => { pressedAt = performance.now(); });
canvas.addEventListener('pointerup', () => {
  if (!pressedAt) return;
  const held = performance.now() - pressedAt; pressedAt = 0;
  if (!served || view.override) {           // demo: a tap steps through the poses
    if (held < 600) stepPose(1);
    return;
  }
  sendAction(held >= 5000 ? 'shutdown' : 'tap');
});

// ── Frame loop ───────────────────────────────────────────────────────────
const frozen = params.has('freeze');
let last = performance.now(), frameCount = 0, fpsSince = last, clock = Number(params.get('t') || 0);

// Frames per second. 30 looks the same on this face and roughly halves the
// GPU work, which keeps the Pi cooler and its fan quieter. ?fps=60 overrides.
const FPS_CAP = Math.max(Number(params.get('fps')) || 30, 1);

function frame(now) {
  requestAnimationFrame(frame);
  // The display refreshes at 60 Hz; skip refreshes until a frame is due
  if (!frozen && now - last < 1000 / FPS_CAP - 2) return;
  const dt = frozen ? 1 / 60 : Math.min((now - last) / 1000, 0.1);
  last = now; if (!frozen) clock += dt;
  const t = clock;

  screensaver.update(now);
  updateOverlay(now);
  const pose = POSES[view.pose], since = t - view.poseSince, live = frozen ? 0 : 1;

  // Mouth: loud, open sounds are tall and narrow; quiet ones short and wide
  const loud = pose.talk ? loudness(t, dt, now) : 0;
  const tall = loud * (0.75 + 0.25 * speech.shape);
  const pulse = pose.pulse ? live * 4 * Math.sin(t * 1.6) : 0;
  if (pose.talk) {
    face.mouthOpen.target = loud < 0.06 ? 0 : 14 + 46 * tall;
    face.mouthW.target = loud < 0.06 ? 97 : 90 - 34 * tall * (0.6 + 0.4 * speech.shape);
  } else {
    face.mouthOpen.target = (pose.open || 0) + pulse;
    face.mouthW.target = (pose.width || 97) + pulse;
  }
  face.eyeScale.target = 1 + 0.05 * loud;
  face.eyeY.target = (pose.eyeY || 0) + live * ((pose.droop ? 3 + 3 * Math.sin(t * 2.1) : 0) + (pose.drift ? 3 * Math.sin(t * 1.2) : 0));
  face.mouthY.target = (pose.mouthY || 0) + live * (pose.bounce ? 4 * Math.sin(t * 1.6) : 0);
  if (pose.dotPulse) face.dotR.target = pose.dotR + live * pose.dotPulse * Math.sin(t * 1.6);
  updateGaze(t);
  let blinkValue = Math.max(blinkAmount(t), face.blinkMin.value, pose.blinkPulse ? pose.blinkPulse * wave(since, 1.6) : 0);

  // Boot: symbols for eyes and a sliding mouth while the brain loads, then the eyes open
  if (view.pose === 'warmup') {
    face.eyeShow.target = boot.stage >= 13 ? 1 : 0;
    face.mouthX.target = boot.stage >= 13 ? 0 : 25 * Math.sin((now - boot.since) / 1000 * 0.8);
    blinkValue = boot.stage === 13 ? 1 : boot.stage === 14 ? 0.5 : boot.stage >= 15 ? 0 : blinkValue;
  }

  if (frozen) {     // still frames from URL parameters
    allEased().forEach((item) => item.snap());
    if (params.has('open')) face.mouthOpen.value = Number(params.get('open'));
    if (params.has('width')) face.mouthW.value = Number(params.get('width'));
    blinkValue = Math.max(Number(params.get('blink') || 0), face.blinkMin.value);
    if (params.has('gaze')) face.gazeX.value = Number(params.get('gaze'));
  } else {
    allEased().forEach((item) => item.step(dt));
  }

  uniforms.uTime.value = t;
  uniforms.uEyeK.value.set(...face.eye.map((w) => clamp01(w.value)));
  uniforms.uEyeK2.value.set(...face.eye2.map((w) => clamp01(w.value)));
  uniforms.uMouthK.value.set(...face.mouth.map((w) => clamp01(w.value)));
  uniforms.uSlant.value = face.slant.value;
  uniforms.uDotR.value = face.dotR.value;
  uniforms.uDotR2.value = face.dotR2.value;
  uniforms.uWink.value = clamp01(face.wink.value);
  uniforms.uEyeShow.value = clamp01(face.eyeShow.value);
  uniforms.uMouthShow.value = clamp01(face.mouthShow.value);
  uniforms.uHeartScale.value = pose.heartBeat ? 1 + live * 0.5 * Math.pow(wave(t, 5), 3) : 1;      // a beat, not a sway
  uniforms.uStarRot.value = pose.starSpin ? live * t * 1.2 : 0;
  uniforms.uMouthPlain.value = clamp01(face.plain.value);
  uniforms.uBlink.value = blinkValue;
  uniforms.uGaze.value.set(face.gazeX.value, face.gazeY.value);
  uniforms.uEyeScale.value = face.eyeScale.value;
  uniforms.uMouthOpen.value = Math.max(0, face.mouthOpen.value);
  uniforms.uMouthW.value = face.mouthW.value;
  uniforms.uBob.value = live * (1.6 * Math.sin(t * 1.5) + 1.2 * loud);                 // breathing
  uniforms.uMouthY.value = face.mouthY.value;
  uniforms.uMouthX.value = face.mouthX.value;
  uniforms.uEyeY.value = face.eyeY.value;
  uniforms.uEyeJit.value = live * (pose.tremble ? 1.6 * Math.sin(t * 34) : 0);         // angry tremble
  uniforms.uFx.value = clamp01(face.fx.value);
  renderer.render(scene, camera);

  frameCount++;
  if (now - fpsSince > 1000) { $('fps').textContent = Math.round(frameCount * 1000 / (now - fpsSince)) + ' fps'; frameCount = 0; fpsSince = now; }
}

// ── Controls (demo and tinkering; hidden in kiosk mode) ──────────────────
function note(text) { $('note').textContent = text; }
function setOverride(name) { view.override = name; applyExpression(); }
function toggleFx() { face.fx.target = face.fx.target > 0.5 ? 0 : 1; updateControls(); }
function updateControls() {
  $('pose').value = view.pose;
  $('btn-mic').setAttribute('aria-pressed', mic.on);
  $('btn-fx').setAttribute('aria-pressed', face.fx.target > 0.5);
  $('btn-live').hidden = !(served && view.override);
}
for (const name of POSE_KEYS) $('pose').add(new Option(name.replace('_', ' '), name));
$('pose').onchange = () => setOverride($('pose').value);
function stepPose(by) { setOverride(POSE_KEYS[(POSE_KEYS.indexOf(view.pose) + by + POSE_KEYS.length) % POSE_KEYS.length]); }
$('btn-prev').onclick = () => stepPose(-1);
$('btn-next').onclick = () => stepPose(1);
$('btn-mic').onclick = toggleMic;
$('btn-fx').onclick = toggleFx;
$('btn-live').onclick = () => { view.override = null; mic.on = false; applyExpression(); };
addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (e.key === 'ArrowRight') stepPose(1);
  else if (e.key === 'ArrowLeft') stepPose(-1);
  else if (key === 'a') setOverride('speaking');
  else if (key === 'i') setOverride('idle');
  else if (key === 'm') toggleMic();
  else if (key === 'c') toggleFx();
  else if (key === 'h') document.body.classList.toggle('kiosk');
});

// ── Start ────────────────────────────────────────────────────────────────
if (params.has('kiosk')) document.body.classList.add('kiosk');
if (params.get('fx') === '0') { face.fx.target = 0; face.fx.snap(); }
if (served) {
  try {
    config = await (await fetch('/config.json')).json();
    Object.assign(theme, config.theme || {});
    uniforms.uBg.value.set(theme.face_bg);
    document.title = `${config.name} — live face`;
  } catch (err) { note('No engine configuration: ' + err.message); }
  connect();
}
if (params.has('pose')) setOverride(params.get('pose'));
else applyExpression();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
